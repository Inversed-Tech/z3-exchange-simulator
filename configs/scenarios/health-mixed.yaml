name: health-mixed
description: "Health check: small mixed-flow run exercising all four transaction types together. Throwaway values, small scale."
seed: 20260803

accounts_count: 6
accounts_active_fraction: 1.0

load_duration_seconds: 30
load_target_tps: 1.0

flows:
  transparent_to_transparent: 0.25
  transparent_to_shielded: 0.25
  shielded_to_transparent: 0.25
  shielded_to_shielded: 0.25

warmup_blocks: 20

confirmations_deposit_required: 1

observability:
  record_rpc_calls: true
  record_component_logs: true
  metric_sampling_interval_secs: 2
  mempool_saturation_threshold: 500

activity_profiles:
  low_fraction: 0.50
  medium_fraction: 0.35
  high_fraction: 0.15

amounts:
  min_zatoshis: 10000
  max_zatoshis: 1000000


# Baselined against run 20260906T084635Z-health-mixed: attempted 30, confirmed
# 17, failed 13 (10 mempool_conflict; 3 other — 2 sweeps that found no notes
# from an account swept twice, 1 transient RPC transport error), timed_out 0
# (see experiments/runs/20260906T084635Z-health-mixed/).
expectations:
  min_confirmed: 15
  max_terminal_failures: 16
  max_timeouts: 0
  allowed_error_classes: []
