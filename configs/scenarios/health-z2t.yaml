name: health-z2t
description: "Health check: shielded-to-transparent flow in isolation. Throwaway values, small scale. load_duration_seconds is intentionally low (~1 intent/account): each ZToT intent sweeps its account's entire shielded balance, so any account hit twice in one run fails its second intent with 'no notes found' by design (see docs/z3-concurrent-request-ceiling.md) — not a defect, but noise this scenario is sized to avoid."
seed: 20260803

accounts_count: 6
accounts_active_fraction: 1.0

load_duration_seconds: 6
load_target_tps: 1.0

flows:
  transparent_to_transparent: 0.0
  transparent_to_shielded: 0.0
  shielded_to_transparent: 1.0
  shielded_to_shielded: 0.0

warmup_blocks: 20

confirmations_deposit_required: 1

observability:
  record_rpc_calls: true
  record_component_logs: true
  metric_sampling_interval_secs: 2
  mempool_saturation_threshold: 500

activity_profiles:
  low_fraction: 0.50
  medium_fraction: 0.35
  high_fraction: 0.15

amounts:
  min_zatoshis: 10000
  max_zatoshis: 1000000


# Baselined against run 20260906T080053Z-health-z2t: attempted 6, confirmed 2,
# failed 4 (all mempool_conflict — an account hit twice racing its own prior
# sweep, exactly the "by design" noise this scenario's own sizing accepts;
# see the description above), timed_out 0. Small sample size and inherently
# high variance by design, so thresholds are wide: the point of this scenario
# is proving the ZToT flow works at all, not a tight pass/fail bar.
expectations:
  min_confirmed: 1
  max_terminal_failures: 5
  max_timeouts: 0
  allowed_error_classes: []
