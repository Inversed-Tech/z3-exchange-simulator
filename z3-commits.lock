# Pinned Z3 commits for reproducible simulator runs.
#
# The primary pinned entity is the Z3 meta-repository. Individual component versions
# are determined by the Docker images Z3 references at the pinned commit, which are
# themselves pinned by image tag (and, where possible, by sha256 digest).
# Component commits below are recorded for reference and findings report attribution.
#
# All findings in the final report reference these exact versions.
# See docs/integration/pinned-commits.md for the rationale.

z3:
  repo: https://github.com/ZcashFoundation/z3
  branch: main
  commit: dfb9d0eae6d3f67a3c184e0d8fcb1166e7740724
  note: >
    Confirmed by the Foundation (Gustavo). The simulator drives the Z3 Docker Compose
    stack at this commit; the component image tags below are the versions this commit
    pins. Frozen for the duration of the engagement.

zebra:
  repo: https://github.com/ZcashFoundation/zebra
  version: v5.0.0
  image: zfnd/zebra:5.0.0
  commit: 1e6519ea91e2d3035c20aadd4d9a40dcac2eed3a
  note: Verified — the v5.0.0 git tag resolves to this commit.

zaino:
  repo: https://github.com/zingolabs/zaino
  version: 0.4.0-rc.2
  image: zingodevops/zainod:0.4.0-rc.2
  commit: 0cf4fd5008a7536e3495e3e377073faac1cb28f3
  note: >
    Verified — the 0.4.0-rc.2 git tag resolves to this commit. Z3 runs the -no-tls
    image variant in regtest (plaintext h2c gRPC, no client auth).

zallet:
  repo: https://github.com/zcash/wallet
  version: v0.1.0-alpha.3
  image: electriccoinco/zallet:v0.1.0-alpha.3
  commit: 6fc85f68cf5ebe456160c6518255a83129e7d21c
  note: >
    Commit recorded as provided by the Foundation. Provenance note: the v0.1.0-alpha.3
    git tag itself resolves to f0db32d23de36b9a8e0c48b4438d22ab076aca58; the Foundation's
    commit is one commit later on the same line of history. Runtime is fixed by the image
    tag/digest above regardless of which commit is cited for attribution.

# ── Regtest override set (2026-07-29) ──────────────────────────────────────────
# The frozen pins above cannot produce a non-zero confirmation rate: Zallet
# v0.1.0-alpha.3's z_sendmany passes a shielded-only spend policy to the
# proposal builder, so it cannot spend from ANY pool (measured;
# scripts/experiments/funding-probe.sh). The combination below is the
# upstream-coherent set the simulator runs against instead — each component's
# lockfile pins the others' crate versions (Zallet beta.1 embedded
# zaino@8048bf8 and zebra-state 10.1 = Zebra v6.0.0; standalone Zaino 0.6.0
# locks the same zebra-state; beta.2 moved to zaino@d2d06bd/zebra-state 12.0.1
# — see the `zallet:` note below). Applied via Z3_{ZEBRA,ZAINO,ZALLET}_IMAGE in
# external/z3/.env.regtest; the Z3 compose commit stays as pinned above.
# Validation: scripts/experiments/fanout-probe.sh — 12/12 steps on a fresh
# datadir (mine → shield → fan out to 5 accounts → sink spends back).

overrides:
  zebra:
    version: v6.0.0
    image: zfnd/zebra:6.0.0
    commit: bb41d69013edbfa8594bb097fa751f47eeb31445   # v6.0.0 tag, external/zebra checkout
  zaino:
    version: 0.6.0
    image: zingodevops/zainod:0.6.0-no-tls
    commit: 17963672d0c2cad97dd12bd38bbf1b6fd232c8c5   # 0.6.0 tag, external/zaino checkout
  zallet:
    version: v0.1.0-beta.2
    image: z3sim/zallet:v0.1.0-beta.2
    commit: bd7f020eb9e1de6f79da947e8102281832b05f83
    note: >
      Bumped from beta.1 (2026-07-31) to fix the Zallet restart crash-loop
      documented in docs/zallet-restart-sync-failure.md: beta.1's
      data-requests sync task treated any chain-backend error on a persisted
      transaction data request as fatal, which killed the whole process and
      caused a permanent restart loop once the wallet DB held one stale
      request (e.g. a transaction that only ever existed in Zebra's mempool
      and did not survive a container restart). Fixed upstream by
      zcash/zallet PR #598 (closes zcash/zallet#599), which is included in
      beta.2 per its CHANGELOG "Fixed" section and confirmed via `git
      merge-base --is-ancestor`. No upstream image exists past
      v0.1.0-alpha.3. Built locally from the official release tarball by
      scripts/dev/zallet-release-image/build.sh (SHA-256 pinned there).
      Requires Zebra >= 6.0.0: its embedded Zaino queries the "ironwood"
      subtree pool, which Zebra v5.0.0 rejects. Note: beta.2 moved its
      embedded zaino-state dependency from zingolabs/zaino@8048bf8 (0.3.1) to
      zodl-inc/zaino@d2d06bd (0.5.0), whose Cargo.lock pins zebra-state
      12.0.1 (shipped by Zebra v6.2.3) rather than beta.1's zebra-state
      10.1.0 (Zebra v6.0.0). Zallet reaches Zebra only over JSON-RPC
      (`[indexer] validator_address`), not via direct RocksDB access, so
      this is expected to remain wire-compatible with the pinned Zebra
      v6.0.0; not yet independently re-verified beyond the funding-pipeline
      probes re-run after this bump.
