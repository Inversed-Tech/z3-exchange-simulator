[package]
name = "z3-exchange-simulator"
version = "0.1.0"
edition = "2021"
description = "Exchange-scale load simulator for the Z3 Zcash stack (Zebra, Zaino, Zallet)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Inversed-Tech/z3-exchange-simulator"

[lib]
name = "z3_exchange_simulator"
path = "src/lib.rs"

[[bin]]
name = "z3sim"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
