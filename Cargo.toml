[package]
name = "z3-exchange-simulator"
version = "0.1.0"
edition = "2021"
description = "Exchange-scale load simulator for the Z3 Zcash stack (Zebra, Zaino, Zallet)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Inversed-Tech/z3-exchange-simulator"

[lib]
name = "z3_exchange_simulator"
path = "src/lib.rs"

[[bin]]
name = "z3sim"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ttf"] }
rand = "0.8"
rand_chacha = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
